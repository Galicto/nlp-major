version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: urbanmind_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - urbanmind_net

  redis:
    image: redis:alpine
    container_name: urbanmind_redis
    ports:
      - "6379:6379"
    networks:
      - urbanmind_net

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanmind_api
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - urbanmind_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanmind_frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - urbanmind_net

networks:
  urbanmind_net:
    driver: bridge

volumes:
  mongodb_data:
